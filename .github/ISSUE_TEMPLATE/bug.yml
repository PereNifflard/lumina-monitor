name: "Bug / Bogue"
description: "Something isn't working / Quelque chose ne marche pas"
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        First, check `%APPDATA%\LuminaMonitor\lumina.log`, and the
        **Troubleshooting** section of `docs/INSTALLATION.md`.

        ⚠️ **Do not paste device identifiers** — UDID, serial number,
        pairing record addresses. Replace them with `…` in anything you
        copy.

        ---

        Avant tout : regarde `%APPDATA%\LuminaMonitor\lumina.log`, et la
        section **Dépannage** de `docs/INSTALLATION.fr.md`.

        ⚠️ **Ne colle pas d'identifiants d'appareil** — UDID, numéro de
        série, adresses des enregistrements d'appairage. Remplace-les par
        `…` dans ce que tu copies.

  - type: textarea
    id: symptome
    attributes:
      label: What happens / Ce qui se passe
      description: And what you expected instead. / Et ce que tu attendais à la place.
      placeholder: The mirror opens, then freezes after ten seconds. / Le miroir s'ouvre, puis se fige au bout de dix secondes.
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version / Version de Windows
      placeholder: Windows 11 Pro 24H2 (x64)
    validations:
      required: true

  - type: input
    id: ios
    attributes:
      label: iOS version / Version d'iOS
      description: iPhone model if you have it handy. / Modèle d'iPhone si tu l'as sous la main.
      placeholder: iOS 27.0, iPhone 17 Pro Max
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version the Developer Disk Image came from / Version d'Xcode d'où vient l'image développeur
      description: The archive you gave the app on first launch (Xcode `.xip` or Device Support `.dmg`). / L'archive que tu as donnée à l'app au premier lancement (`.xip` Xcode ou `.dmg` Device Support).
      placeholder: Xcode 27 beta 6 (.xip)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Lumina Monitor version / Version de Lumina Monitor
      description: The downloaded zip's name, or "built from source." / Le nom du zip téléchargé, ou « compilé depuis les sources ».
      placeholder: LuminaMonitor-1.0.0-win-x64.zip
    validations:
      required: true

  - type: textarea
    id: journal
    attributes:
      label: Excerpt from lumina.log / Extrait de lumina.log
      description: The lines around the problem, not the whole file. Device identifiers removed. / Les lignes autour du problème, pas le fichier entier. Identifiants d'appareil retirés.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: verifications
    attributes:
      label: Checks / Vérifications
      options:
        - label: The **Apple Devices** app is running, and the iPhone is paired. / L'app **Appareils Apple** tourne, et l'iPhone est appairé.
        - label: **Developer Mode** is enabled on the phone. / Le **Mode développeur** est actif sur le téléphone.
        - label: No other session is running (one window only, no probe in parallel). / Aucune autre session en cours (une seule fenêtre, pas de sonde en parallèle).
        - label: I removed device identifiers from what I pasted above. / J'ai retiré les identifiants d'appareil de ce que j'ai collé.
          required: true
